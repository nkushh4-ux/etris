services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etris}
      POSTGRES_USER: ${POSTGRES_USER:-etris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etris}
    ports:
      - "5432:5432"
    volumes:
      - etris_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-etris} -d $${POSTGRES_DB:-etris}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  etris_postgres_data:
