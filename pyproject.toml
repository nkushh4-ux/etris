[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "etris-ultimate-ai"
version = "0.1.0"
description = "City-wide AI engine for multi-camera ANPR trajectory tracking and urban traffic analytics"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "numpy>=2.5,<3",
    "scipy>=1.18,<2",
    "opencv-python>=5,<6",
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<0.30",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
include = ["backend*","cv*","evaluation*"]
